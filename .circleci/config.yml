version: 2.1

orbs:
  snyk: snyk/snyk@2.2.0

jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout

      - run:
          name: Build
          command: mvn -B -DskipTests clean package

      - run:
          name: Test
          command: mvn test

      # -----------------------------
      # Snyk SAST (Snyk Code)
      # -----------------------------
      - snyk/scan:
          command: code test
          fail-on-issues: false
          monitor-on-build: false
          project: WebGoat/main-app
          severity-threshold: high
          token-variable: SNYK_TOKEN

      # -----------------------------
      # Snyk SCA (Open Source deps)
      # -----------------------------
      - snyk/scan:
          command: test --all-projects --dep-graph
          fail-on-issues: false
          monitor-on-build: true
          project: WebGoat/main-app
          severity-threshold: high
          token-variable: SNYK_TOKEN

workflows:
  sample:
    jobs:
      - build-and-test
